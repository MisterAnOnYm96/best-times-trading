<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Eng yaxshi trading vaqtlari</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    darkMode: 'class',
    theme: {
      extend: {
        colors: { brand: { 500: '#3b82f6', 600: '#2563eb' } }
      }
    }
  }
</script>
<style>
  /* ===== TIMELINE RULER ===== */
  .ruler-wrap {
    display: flex;
    align-items: flex-end;
    gap: 2px;
    height: 120px;
    padding: 8px 0 0 0;
    overflow: visible;
  }
  .ruler-seg {
    flex: 1 1 0;
    min-width: 0;
    height: 70px;
    border-radius: 6px 6px 0 0;
    position: relative;
    cursor: pointer;
    transition: all .35s cubic-bezier(.4,0,.2,1);
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    align-items: center;
    padding-bottom: 4px;
    font-family: ui-monospace, monospace;
    font-size: 11px;
    color: #fff;
    user-select: none;
  }
  .ruler-seg:hover { filter: brightness(1.08); }

  /* kattalashgan segment */
  .ruler-seg.active {
    flex: 4 1 0;              /* kengayadi */
    height: 110px;            /* balandroq */
    z-index: 10;
    box-shadow: 0 6px 24px rgba(0,0,0,.25);
    border-radius: 10px 10px 0 0;
    font-size: 14px;
    font-weight: 700;
  }
  /* kichraygan segmentlar (boshqasi tanlanganda) */
  .ruler-wrap.has-active .ruler-seg:not(.active) {
    flex: 0.55 1 0;
    height: 50px;
    opacity: .55;
    font-size: 9px;
  }
  /* hozirgi soat belgisi */
  .ruler-seg.now::after {
    content: '';
    position: absolute;
    bottom: -10px;
    left: 50%;
    transform: translateX(-50%);
    width: 8px; height: 8px;
    border-radius: 50%;
    background: #3b82f6;
    box-shadow: 0 0 0 3px rgba(59,130,246,.25);
  }
  /* shkala (lineyka) chizig'i */
  .ruler-base {
    position: relative;
    height: 1px;
    background: currentColor;
    opacity: .25;
    margin-top: 0;
  }
  .ruler-base .tick {
    position: absolute;
    top: -6px;
    width: 1px;
    height: 6px;
    background: currentColor;
    opacity: .5;
  }
  .ruler-base .tick.major { height: 12px; top: -12px; opacity: .8; }

  /* ranglar */
  .liq-overlap { background: linear-gradient(180deg,#34d399,#059669); }
  .liq-high    { background: #22c55e; }
  .liq-medium  { background: #facc15; color:#3f3f46; }
  .liq-low     { background: #cbd5e1; color:#64748b; }
  .dark .liq-low { background: #475569; color:#cbd5e1; }
</style>
</head>
<body class="bg-gray-50 dark:bg-gray-900 text-gray-800 dark:text-gray-100 transition-colors">

<!-- HEADER -->
<header class="bg-white dark:bg-gray-800 shadow-sm sticky top-0 z-30">
  <div class="max-w-6xl mx-auto px-4 py-3 flex items-center justify-between">
    <h1 class="font-bold text-lg">📊 Trading Times</h1>
    <div class="flex items-center gap-3">
      <select id="tzSelect" class="text-sm bg-gray-100 dark:bg-gray-700 rounded-lg px-3 py-1.5 outline-none">
        <option value="5">Toshkent (UTC+5)</option>
        <option value="0">UTC</option>
        <option value="3">London (UTC+3)</option>
        <option value="-5">New York (UTC-5)</option>
        <option value="9">Tokyo (UTC+9)</option>
      </select>
      <button id="themeToggle" class="text-xl" title="Rejim">🌙</button>
    </div>
  </div>
</header>

<main class="max-w-6xl mx-auto px-4 py-6 space-y-8">

  <!-- 24 SOATLIK TIMELINE RULER -->
  <section class="bg-white dark:bg-gray-800 rounded-2xl p-4 shadow-sm text-gray-800 dark:text-gray-100">
    <div class="flex items-center justify-between mb-3">
      <h3 class="font-bold">24 soatlik likvidlik shkalasi</h3>
      <div class="flex items-center gap-3 text-xs text-gray-500 dark:text-gray-400">
        <span><span class="inline-block w-3 h-3 rounded bg-gradient-to-b from-green-400 to-emerald-600"></span> Overlap</span>
        <span><span class="inline-block w-3 h-3 rounded bg-green-500"></span> Yuqori</span>
        <span><span class="inline-block w-3 h-3 rounded bg-yellow-400"></span> O'rta</span>
        <span><span class="inline-block w-3 h-3 rounded bg-gray-300 dark:bg-gray-600"></span> Past</span>
      </div>
    </div>

    <!-- RULER -->
    <div id="rulerWrap" class="ruler-wrap"></div>
    <div class="ruler-base" id="rulerBase"></div>

    <!-- ma'lumot paneli -->
    <div id="segInfo" class="mt-4 text-sm bg-gray-50 dark:bg-gray-700/40 rounded-xl px-4 py-3 min-h-[52px] text-gray-600 dark:text-gray-300">
      Soatni tanlang — likvidlik va tavsiya ko'rsatiladi.
    </div>

    <p class="text-xs text-gray-400 mt-3">⭐ London–New York overlap — eng yuqori likvidlik davri</p>
  </section>

  <!-- JUFTLIKLAR BO'YICHA -->
  <section class="bg-white dark:bg-gray-800 rounded-2xl p-4 shadow-sm">
    <h3 class="font-bold mb-3">Instrument bo'yicha eng yaxshi vaqtlar</h3>
    <div class="flex flex-wrap gap-2 mb-4" id="instrumentFilter"></div>
    <div id="instrumentList" class="space-y-2"></div>
  </section>

</main>

<footer class="text-center text-xs text-gray-400 py-6">
  Ma'lumotlar taxminiy. Trading qarorlaringizni o'zingiz qabul qiling.
</footer>

<script>
// ================== MA'LUMOTLAR ==================
const INSTRUMENTS = [
  { type: 'Forex',  pairs: ['EUR/USD', 'GBP/USD'], best: 'London + NY overlap (12:00–16:00 UTC)' },
  { type: 'Forex',  pairs: ['USD/JPY', 'AUD/USD'], best: 'Tokyo + London overlap (07:00–09:00 UTC)' },
  { type: 'Metall', pairs: ['XAU/USD (Oltin)'],    best: 'London ochilishi va NY (12:00–16:00 UTC)' },
  { type: 'Indeks', pairs: ['US500', 'NAS100'],    best: 'New York (12:00–21:00 UTC)' },
  { type: 'Kripto', pairs: ['BTC/USD'],            best: 'London + NY (12:00–16:00 UTC)' },
];

// ================== HOLAT ==================
let tzOffset = 5;
let selectedHour = null; // foydalanuvchi tanlagan soat (UTC)

// ================== YORDAMCHI ==================
function pad(n){ return String(n).padStart(2,'0'); }
function utcHourToLocal(h){
  let local = (h + tzOffset) % 24;
  if (local < 0) local += 24;
  return local;
}
function liquidityAt(utcHour){
  const london = utcHour >= 7 && utcHour < 16;
  const ny = utcHour >= 12 && utcHour < 21;
  const tokyo = utcHour >= 0 && utcHour < 9;
  if (london && ny) return 'overlap';
  if (london || ny) return 'high';
  if (tokyo) return 'medium';
  return 'low';
}
function liquidityLabel(liq){
  return { overlap: 'Overlap ⭐', high: 'Yuqori', medium: "O'rta", low: 'Past' }[liq];
}

// ================== RENDER: RULER ==================
function renderRuler(){
  const wrap = document.getElementById('rulerWrap');
  const base = document.getElementById('rulerBase');
  const utcNow = new Date().getUTCHours();

  // segmentlar
  wrap.innerHTML = '';
  for (let utc = 0; utc < 24; utc++){
    const local = utcHourToLocal(utc);
    const liq = liquidityAt(utc);
    const seg = document.createElement('div');
    seg.className = `ruler-seg liq-${liq}` + (utc === utcNow ? ' now' : '');
    if (selectedHour !== null && utc === selectedHour) seg.classList.add('active');
    seg.dataset.utc = utc;
    seg.title = `${pad(local)}:00 — ${liquidityLabel(liq)}`;
    seg.textContent = pad(local);
    seg.addEventListener('click', () => {
      selectedHour = (selectedHour === utc) ? null : utc;
      renderRuler();
      renderSegInfo();
    });
    wrap.appendChild(seg);
  }
  // "has-active" klassi — boshqalarni kichraytirish
  if (selectedHour !== null) wrap.classList.add('has-active');
  else wrap.classList.remove('has-active');

  // lineyka (shkala) ticklari
  let ticks = '';
  for (let i = 0; i <= 24; i++){
    const left = (i / 24) * 100;
    const major = (i % 3 === 0);
    ticks += `<div class="tick ${major ? 'major' : ''}" style="left:${left}%"></div>`;
  }
  base.innerHTML = ticks;
}

// ================== RENDER: MA'LUMOT PANELI ==================
function renderSegInfo(){
  const info = document.getElementById('segInfo');
  if (selectedHour === null){
    info.innerHTML = 'Soatni tanlang — likvidlik va tavsiya ko\'rsatiladi.';
    return;
  }
  const local = utcHourToLocal(selectedHour);
  const liq = liquidityAt(selectedHour);
  const colors = {
    overlap: 'text-emerald-600 dark:text-emerald-400',
    high:    'text-green-600 dark:text-green-400',
    medium:  'text-yellow-600 dark:text-yellow-400',
    low:     'text-gray-500 dark:text-gray-400'
  };
  let advice = {
    overlap: 'Eng yaxshi vaqt! London va NY birga ochiq — yuqori likvidlik, tor spread.',
    high:    'Yaxshi vaqt — asosiy sessiya faol.',
    medium:  'O\'rtacha — Osiyo sessiyasi, JPY/AUD juftliklariga mos.',
    low:     'Past likvidlik — ehtiyot bo\'ling, spread keng bo\'lishi mumkin.'
  }[liq];
  info.innerHTML = `
    <div class="flex flex-wrap items-center gap-x-6 gap-y-1">
      <span class="font-mono font-bold text-base">${pad(local)}:00 – ${pad((local+1)%24)}:00</span>
      <span class="text-xs text-gray-400">(UTC ${pad(selectedHour)}:00)</span>
      <span class="font-semibold ${colors[liq]}">${liquidityLabel(liq)}</span>
      <span class="text-gray-600 dark:text-gray-300">${advice}</span>
    </div>`;
}

// ================== INSTRUMENTLAR ==================
function renderInstruments(){
  const filterEl = document.getElementById('instrumentFilter');
  const types = ['Hammasi', ...new Set(INSTRUMENTS.map(i => i.type))];
  filterEl.innerHTML = types.map((t, i) =>
    `<button class="inst-btn text-sm px-3 py-1.5 rounded-lg border border-gray-200 dark:border-gray-600 ${i===0?'bg-brand-500 text-white border-brand-500':''}" data-type="${t}">${t}</button>`
  ).join('');

  document.querySelectorAll('.inst-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.inst-btn').forEach(b => {
        b.classList.remove('bg-brand-500','text-white','border-brand-500');
        b.classList.add('border-gray-200','dark:border-gray-600');
      });
      btn.classList.add('bg-brand-500','text-white','border-brand-500');
      btn.classList.remove('border-gray-200','dark:border-gray-600');
      renderInstrumentList(btn.dataset.type);
    });
  });
  renderInstrumentList('Hammasi');
}
function renderInstrumentList(type){
  const list = document.getElementById('instrumentList');
  const items = type === 'Hammasi' ? INSTRUMENTS : INSTRUMENTS.filter(i => i.type === type);
  list.innerHTML = items.map(i => `
    <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-2 p-3 rounded-xl bg-gray-50 dark:bg-gray-700/50">
      <div>
        <span class="text-xs uppercase tracking-wide text-brand-600 dark:text-brand-500 font-semibold">${i.type}</span>
        <p class="font-semibold">${i.pairs.join(', ')}</p>
      </div>
      <p class="text-sm text-gray-600 dark:text-gray-300">⏰ ${i.best}</p>
    </div>
  `).join('');
}

// ================== TEMA ==================
function initTheme(){
  const saved = localStorage.getItem('theme');
  if (saved === 'dark' || (!saved && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
    document.documentElement.classList.add('dark');
  }
  updateThemeBtn();
}
function updateThemeBtn(){
  document.getElementById('themeToggle').textContent =
    document.documentElement.classList.contains('dark') ? '☀️' : '🌙';
}
document.getElementById('themeToggle').addEventListener('click', () => {
  const isDark = document.documentElement.classList.toggle('dark');
  localStorage.setItem('theme', isDark ? 'dark' : 'light');
  updateThemeBtn();
});

// ================== TZ SELECT ==================
document.getElementById('tzSelect').addEventListener('change', (e) => {
  tzOffset = parseInt(e.target.value);
  localStorage.setItem('tzOffset', tzOffset);
  selectedHour = null; // mintaqa o'zgarsa tanlovni tozalaymiz
  renderRuler();
  renderSegInfo();
});

// ================== INIT ==================
(function init(){
  initTheme();
  const savedTz = localStorage.getItem('tzOffset');
  if (savedTz !== null) {
    tzOffset = parseInt(savedTz);
    document.getElementById('tzSelect').value = savedTz;
  }
  renderInstruments();
  renderRuler();
  renderSegInfo();
  setInterval(renderRuler, 60000); // har daqiqada "now" belgisini yangilash
})();
</script>
</body>
</html>
