<!DOCTYPE html>
<html lang="uz" class="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Eng yaxshi trading vaqtlari</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    darkMode: 'class',
    theme: {
      extend: { colors: { brand: { 500: '#3b82f6', 600: '#2563eb' } } }
    }
  }
</script>
<style>
  /* Raqamli inputlardagi strelkalarni yashirish */
  input[type="number"]::-webkit-outer-spin-button,
  input[type="number"]::-webkit-inner-spin-button {
    -webkit-appearance: none;
    margin: 0;
  }
  input[type="number"] {
    -moz-appearance: textfield;
    appearance: textfield;
  }
  input[type="number"]:focus {
    outline: none;
  }

  /* ===== TIMELINE RULER ===== */
  .ruler-wrap { 
    display: flex; 
    align-items: flex-end; 
    gap: 2px; 
    height: 60px; 
    padding: 4px 0 0 0; 
    overflow: visible; 
    position: relative;
    margin-bottom: 6px; 
    touch-action: none;
    user-select: none;
  }
  
  .ruler-seg {
    flex: 1 1 0; 
    min-width: 0; 
    border-radius: 3px 3px 0 0; 
    position: relative;
    cursor: pointer; 
    transition: flex .35s cubic-bezier(.4,0,.2,1), opacity .35s, filter .2s; 
    display: flex;
    flex-direction: column; 
    justify-content: center; 
    align-items: center; 
    user-select: none;
  }
  .ruler-seg:hover { filter: brightness(1.08); }

  .ruler-seg.liq-low     { height: 15px; }
  .ruler-seg.liq-medium  { height: 25px; }
  .ruler-seg.liq-high    { height: 35px; }
  .ruler-seg.liq-overlap { height: 45px; }

  .ruler-seg.active {
    flex: 3 1 0; 
    z-index: 10; 
    box-shadow: 0 2px 8px rgba(0,0,0,.4);
    border-radius: 4px 4px 0 0; 
  }
  
  .ruler-wrap.has-active .ruler-seg:not(.active) { 
    flex: 0.6 1 0; 
    opacity: .4; 
  }

  .now-line-container {
    position: relative;
    width: 100%;
    height: 6px;
  }
  
  .now-line {
    position: absolute;
    top: 0; 
    height: 4px;
    background: #3b82f6;
    border-radius: 4px;
    z-index: 20;
    box-shadow: 0 0 6px rgba(59,130,246,.6);
    transition: left 0.35s cubic-bezier(.4,0,.2,1), width 0.35s cubic-bezier(.4,0,.2,1);
  }

  .liq-overlap { background: linear-gradient(180deg,#34d399,#059669); }
  .liq-high    { background: #22c55e; }
  .liq-medium  { background: #facc15; color:#3f3f46; }
  .liq-low     { background: #cbd5e1; color:#64748b; }
  .dark .liq-low { background: #475569; color:#cbd5e1; }

  /* ===== BOTTOM SHEET ===== */
  .sheet-overlay { transition: opacity 0.3s ease-in-out; }
  .sheet-content { transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
  
  select:focus, input:focus { outline: none; }

  /* Pulse animatsiyasi */
  .pulse-dot-active {
    box-shadow: 0 0 0 0 rgba(34, 197, 94, 0.7);
    animation: pulse-green 2s infinite;
  }
  @keyframes pulse-green {
    0% { box-shadow: 0 0 0 0 rgba(34, 197, 94, 0.7); }
    70% { box-shadow: 0 0 0 6px rgba(34, 197, 94, 0); }
    100% { box-shadow: 0 0 0 0 rgba(34, 197, 94, 0); }
  }

  /* Drag va Drop effektlari */
  .drag-ghost {
    opacity: 0.4;
    background-color: #374151;
    border: 1px dashed #60a5fa;
  }
  .sortable-item {
    touch-action: pan-y;
  }

  /* Checkbox dizayni */
  .custom-checkbox {
    appearance: none;
    -webkit-appearance: none;
    width: 20px;
    height: 20px;
    border: 2px solid #6b7280;
    border-radius: 4px;
    background-color: transparent;
    cursor: pointer;
    position: relative;
    outline: none;
    flex-shrink: 0;
    transition: all 0.2s;
  }
  .custom-checkbox:checked {
    background-color: #3b82f6;
    border-color: #3b82f6;
  }
  .custom-checkbox:checked::after {
    content: '';
    position: absolute;
    left: 6px;
    top: 2px;
    width: 5px;
    height: 10px;
    border: solid white;
    border-width: 0 2px 2px 0;
    transform: rotate(45deg);
  }
</style>
</head>
<body class="bg-gray-900 text-gray-100 transition-colors">

<!-- HEADER -->
<header class="bg-gray-800 shadow-sm sticky top-0 z-30">
  <div class="max-w-6xl mx-auto px-4 py-3 flex items-center justify-between">
    <h1 class="font-bold text-lg">📊 Trading Times</h1>
    
    <div class="flex items-center gap-1">
      <button id="sortBtn" class="p-2 text-gray-400 hover:text-white rounded-lg hover:bg-gray-700 transition-colors" title="Tartiblash">
        <svg id="sortIconDefault" xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M7 16V4m0 0L3 8m4-4l4 4m6 0v12m0 0l4-4m-4 4l-4-4" />
        </svg>
        <svg id="sortIconCheck" class="w-5 h-5 text-green-400 hidden" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">

        <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M3 4a1 1 0 011-1h16a1 1 0 011 1v2.586a1 1 0 01-.293.707l-6.414 6.414a1 1 0 00-.293.707V17l-4 4v-6.586a1 1 0 00-.293-.707L3.293 7.293A1 1 0 013 6.586V4z" />
        </svg>
      </button>
      
      <button id="menuBtn" class="p-2 text-gray-400 hover:text-white rounded-lg hover:bg-gray-700 transition-colors" title="Menyu">

          <path stroke-linecap="round" stroke-linejoin="round" d="M12 5v.01M12 12v.01M12 19v.01M12 6a1 1 0 110-2 1 1 0 010 2zm0 7a1 1 0 110-2 1 1 0 010 2zm0 7a1 1 0 110-2 1 1 0 010 2z" />

<main class="max-w-6xl mx-auto px-4 py-6 space-y-8">
  <section class="bg-gray-800 rounded-2xl p-4 shadow-sm text-gray-100">
    <div class="flex flex-wrap items-center justify-between gap-2 mb-3">
      <h3 class="font-bold text-base">Likvidlik shkalasi</h3>
      <button id="timeBadge" class="text-sm font-mono font-semibold bg-gray-700 text-gray-300 px-3 py-1 rounded-lg border border-gray-600 transition-colors hover:bg-gray-600 focus:outline-none">
        --:-- - --:--
      </button>
    </div>
    <div id="rulerWrap" class="ruler-wrap"></div>
    <div class="now-line-container" id="baseContainer">
      <div id="nowLine" class="now-line"></div>

  <section class="space-y-1">

<!-- ===== FILTR OYNASI ===== -->
<div id="filterSheet" class="fixed inset-0 z-50 pointer-events-none">
  <div id="sheetOverlay" class="absolute inset-0 bg-black/60 opacity-0 sheet-overlay pointer-events-none"></div>
  <div id="sheetContent" class="absolute bottom-0 left-0 right-0 bg-gray-800 rounded-t-3xl p-5 transform translate-y-full sheet-content pointer-events-auto shadow-2xl border-t border-gray-700">
    <div id="filterGroups" class="flex flex-wrap gap-2 mb-6"></div>
    <button id="saveFilterBtn" class="w-full bg-brand-500 hover:bg-brand-600 text-white font-bold py-3 rounded-xl transition-colors">
      Saqlash
    </button>
  </div>
</div>

<!-- ===== MENYU OYNASI (VAQTNI SOZLASH) ===== -->
<div id="menuSheet" class="fixed inset-0 z-50 pointer-events-none">
  <div id="menuOverlay" class="absolute inset-0 bg-black/60 opacity-0 sheet-overlay pointer-events-none"></div>
  <div id="menuContent" class="absolute bottom-0 left-0 right-0 bg-gray-800 rounded-t-3xl p-5 transform translate-y-full sheet-content pointer-events-auto shadow-2xl border-t border-gray-700 max-h-[90vh] flex flex-col">
    <div id="timeRowsContainer" class="flex flex-col gap-2 mb-4 overflow-y-auto flex-1 pt-2"></div>
    <button id="addTimeBtn" class="w-full bg-gray-700 hover:bg-gray-600 text-white font-bold py-2.5 rounded-xl transition-colors mb-2 text-sm">
      + Qo'shish
    </button>
    <button id="saveMenuBtn" class="w-full bg-brand-500 hover:bg-brand-600 text-white font-bold py-3 rounded-xl transition-colors">
      Saqlash
    </button>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/sortablejs@latest/Sortable.min.js"></script>

<script>
// ================= MA'LUMOTLARNI YUKLASH (localStorage) =================
const defaultInstruments = [
  { type: 'Forex', pair: 'EURUSD', times: ['01:00 - 01:59'], isVisible: true },
  { type: 'Forex', pair: 'USDCAD', times: ['12:00 - 12:59'], isVisible: true },
  { type: 'Forex', pair: 'USDJPY', times: ['12:00 - 12:59'], isVisible: true },
  { type: 'Forex', pair: 'GBPJPY', times: ['04:00 - 04:59'], isVisible: true },
  { type: 'Metall', pair: 'XAUUSD', times: ['07:00 - 07:59'], isVisible: true },
  { type: 'Indeks', pair: 'US30', times: ['01:00 - 01:59', '11:30 - 12:29'], isVisible: true },
  { type: 'Forex', pair: 'AUDUSD', times: ['23:00 - 23:59', '12:00 - 12:59'], isVisible: true },
];

let INSTRUMENTS = JSON.parse(localStorage.getItem('trading_instruments')) || defaultInstruments;
let currentFilterTypes = JSON.parse(localStorage.getItem('trading_filters')) || ['Forex', 'Metall', 'Indeks'];

// Saqlash funksiyasi
function saveToLocalStorage() {
  localStorage.setItem('trading_instruments', JSON.stringify(INSTRUMENTS));
  localStorage.setItem('trading_filters', JSON.stringify(currentFilterTypes));
}

// ========================================================================

let tzOffset = -new Date().getTimezoneOffset() / 60; 
let selectedHour = null;
let isSorting = false; 
let sortableInstance = null; 

function pad(n){ return String(Math.floor(n)).padStart(2,'0'); }

function formatTimeInterval(startUtcH) {
  let localStart = (startUtcH + tzOffset) % 24;
  if (localStart < 0) localStart += 24;
  let localEnd = (startUtcH + 1 + tzOffset) % 24;
  if (localEnd < 0) localEnd += 24;
  
  let hStart = Math.floor(localStart);
  let mStart = Math.round((localStart - hStart) * 60);
  
  let hEnd = Math.floor(localEnd);
  let mEnd = Math.round((localEnd - hEnd) * 60);
  
  let displayEnd = '';
  if (mEnd === 0) {
    let prevHour = (hEnd - 1 + 24) % 24;
    displayEnd = `${pad(prevHour)}:59`;
  } else {
    displayEnd = `${pad(hEnd)}:${pad(mEnd)}`;
  }
  return `${pad(hStart)}:${pad(mStart)} - ${displayEnd}`;
}

function liquidityAt(utcHour){
  const london = utcHour >= 7 && utcHour < 16;
  const ny = utcHour >= 12 && utcHour < 21;
  const tokyo = utcHour >= 0 && utcHour < 9;
  if (london && ny) return 'overlap';
  if (london || ny) return 'high';
  if (tokyo) return 'medium';
  return 'low';
}

function isTimeInRange(timeStr, currentMinutes) {
  try {
    const parts = timeStr.split(' - ');
    if (parts.length !== 2) return false;
    const [startStr, endStr] = parts;
    const [startH, startM] = startStr.split(':').map(Number);
    const [endH, endM] = endStr.split(':').map(Number);
    
    let startTotal = startH * 60 + startM;
    let endTotal = endH * 60 + endM;
    
    if (endTotal < startTotal) {
      return currentMinutes >= startTotal || currentMinutes <= endTotal;
    } else {
      return currentMinutes >= startTotal && currentMinutes <= endTotal;
    }
  } catch (e) {
    return false;
  }
}

document.addEventListener('focusout', function(e) {
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT') {
    setTimeout(() => {
      const viewport = document.querySelector('meta[name="viewport"]');
      if (viewport) {
        viewport.setAttribute('content', 'width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no');
      }
      window.scrollTo(0, window.scrollY);
    }, 150);
  }
});

// SORTING
const sortBtn = document.getElementById('sortBtn');
const sortIconDefault = document.getElementById('sortIconDefault');
const sortIconCheck = document.getElementById('sortIconCheck');

sortBtn.addEventListener('click', () => {
  if (currentFilterTypes.length === 0) return;

  isSorting = !isSorting;
  
  if (isSorting) {
    sortIconDefault.classList.add('hidden');
    sortIconCheck.classList.remove('hidden');
    sortBtn.classList.add('bg-gray-700');
    renderInstrumentList(); 
    
    const listEl = document.getElementById('instrumentList');
    sortableInstance = new Sortable(listEl, {
      animation: 150,
      handle: '.drag-handle', 
      ghostClass: 'drag-ghost',
      onEnd: function (evt) {
        const newOrderPairs = [];
        const items = listEl.querySelectorAll('.sortable-item');
        items.forEach(item => {
          newOrderPairs.push(item.dataset.pair);
        });

        let newInstruments = [];
        newOrderPairs.forEach(pair => {
          const inst = INSTRUMENTS.find(i => i.pair === pair);
          if (inst) newInstruments.push(inst);
        });
        
        INSTRUMENTS.forEach(inst => {
          if (!newOrderPairs.includes(inst.pair)) {
            newInstruments.push(inst);
          }
        });

        INSTRUMENTS = newInstruments;
        saveToLocalStorage(); // Tartib saqlandi
      }
    });
  } else {
    sortIconCheck.classList.add('hidden');
    sortIconDefault.classList.remove('hidden');
    sortBtn.classList.remove('bg-gray-700');
    
    if (sortableInstance) {
      sortableInstance.destroy();
      sortableInstance = null;
    }
    renderInstrumentList(); 
  }
});

// FILTR
const filterSheet = document.getElementById('filterSheet');
const sheetOverlay = document.getElementById('sheetOverlay');
const sheetContent = document.getElementById('sheetContent');
const filterBtn = document.getElementById('filterBtn');
const saveFilterBtn = document.getElementById('saveFilterBtn');
const filterGroups = document.getElementById('filterGroups');
let tempFilterTypes = [...currentFilterTypes];

function openSheet() {
  const types = [...new Set(INSTRUMENTS.map(i => i.type))];
  tempFilterTypes = [...currentFilterTypes];
  
  filterGroups.innerHTML = types.map(t => {
    const isSelected = tempFilterTypes.includes(t);
    return `<button class="filter-tag flex-1 px-2 py-2 rounded-lg font-medium text-sm border text-center ${isSelected ? 'bg-brand-500 border-brand-500 text-white' : 'bg-gray-700 border-gray-600 text-gray-300'}" data-type="${t}">${t}</button>`;
  }).join('');

  document.querySelectorAll('.filter-tag').forEach(btn => {
    btn.addEventListener('click', () => {
      const type = btn.dataset.type;
      if (tempFilterTypes.includes(type)) {
        tempFilterTypes = tempFilterTypes.filter(t => t !== type);
        btn.classList.remove('bg-brand-500', 'border-brand-500', 'text-white');
        btn.classList.add('bg-gray-700', 'border-gray-600', 'text-gray-300');
      } else {
        tempFilterTypes.push(type);
        btn.classList.add('bg-brand-500', 'border-brand-500', 'text-white');
        btn.classList.remove('bg-gray-700', 'border-gray-600', 'text-gray-300');
      }
    });
  });

  filterSheet.classList.remove('pointer-events-none');
  sheetOverlay.classList.remove('opacity-0', 'pointer-events-none');
  sheetContent.classList.remove('translate-y-full');
}

function closeSheet() {
  sheetOverlay.classList.add('opacity-0', 'pointer-events-none');
  sheetContent.classList.add('translate-y-full');
  setTimeout(() => filterSheet.classList.add('pointer-events-none'), 300);
}

filterBtn.addEventListener('click', openSheet);
sheetOverlay.addEventListener('click', closeSheet);

saveFilterBtn.addEventListener('click', () => {
  currentFilterTypes = [...tempFilterTypes];
  
  if (currentFilterTypes.length === 0 && isSorting) {
    isSorting = false;
    sortIconCheck.classList.add('hidden');
    sortIconDefault.classList.remove('hidden');
    sortBtn.classList.remove('bg-gray-700');
    if (sortableInstance) {
      sortableInstance.destroy();
      sortableInstance = null;
    }
  }

  saveToLocalStorage(); // Filtr saqlandi
  renderInstrumentList(); 
  closeSheet();
});

// MENYU (VAQTNI SOZLASH)
const menuSheet = document.getElementById('menuSheet');
const menuOverlay = document.getElementById('menuOverlay');
const menuContent = document.getElementById('menuContent');
const menuBtn = document.getElementById('menuBtn');
const saveMenuBtn = document.getElementById('saveMenuBtn');
const addTimeBtn = document.getElementById('addTimeBtn');
const timeRowsContainer = document.getElementById('timeRowsContainer');

let tempTimeRows = [];

function openMenuSheet() {
  tempTimeRows = [];
  INSTRUMENTS.forEach(inst => {
    inst.times.forEach(time => {
      const match = time.match(/(\d{2}):(\d{2})\s*-\s*(\d{2}):(\d{2})/);
      if (match) {
        tempTimeRows.push({ 
          pair: inst.pair, 
          type: inst.type, 
          startH: match[1], startM: match[2], 
          endH: match[3], endM: match[4],
          isChecked: inst.isVisible 
        });
      } else {
        tempTimeRows.push({ pair: inst.pair, type: inst.type, startH: '00', startM: '00', endH: '00', endM: '00', isChecked: inst.isVisible });
      }
    });
  });
  renderTimeRows();
  
  menuSheet.classList.remove('pointer-events-none');
  menuOverlay.classList.remove('opacity-0', 'pointer-events-none');
  menuContent.classList.remove('translate-y-full');
}

function closeMenuSheet() {
  menuOverlay.classList.add('opacity-0', 'pointer-events-none');
  menuContent.classList.add('translate-y-full');
  setTimeout(() => menuSheet.classList.add('pointer-events-none'), 300);
}

// INPUT VA CHECKBOX JOYLASHUVI
function renderTimeRows() {
  const uniquePairs = [...new Set(INSTRUMENTS.map(i => i.pair))];
  
  timeRowsContainer.innerHTML = tempTimeRows.map((row, index) => {
    return `
      <div class="flex items-center gap-1 w-full">
        <input type="checkbox" class="custom-checkbox mr-1" 
               id="check-${index}" 
               data-index="${index}" 
               ${row.isChecked ? 'checked' : ''} 
               onchange="toggleCheck(${index}, this.checked)">
        
        <select class="w-24 flex-shrink-0 bg-gray-700 border border-gray-600 rounded-lg text-gray-200 text-sm py-1.5 px-1 outline-none" data-index="${index}" data-field="pair">
          ${uniquePairs.map(p => `<option value="${p}" class="bg-gray-800" ${row.pair === p ? 'selected' : ''}>${p}</option>`).join('')}
        </select>

        <div class="flex-1 flex items-center justify-center bg-gray-700/50 border border-gray-600 rounded-lg px-1 py-1 focus-within:border-brand-500 transition-colors">
          
          <!-- onfocus="this.select()" qo'shildi (avtomatik belgilash uchun) -->
          <!-- oninput o'rniga onkeyup ishlatiladi (to'g'ri o'tish uchun) -->
          <input type="number" id="startH-${index}" min="0" max="23" placeholder="00" value="${row.startH}" 
                 class="w-7 bg-transparent text-center text-gray-200 text-sm font-mono outline-none" 
                 data-index="${index}" data-field="startH" 
                 onfocus="this.select()"
                 onkeyup="handleTimeInput(this, 'startM-${index}')">
          <span class="text-gray-400 text-sm font-mono mx-0.5">:</span>
          
          <input type="number" id="startM-${index}" min="0" max="59" placeholder="00" value="${row.startM}" 
                 class="w-7 bg-transparent text-center text-gray-200 text-sm font-mono outline-none" 
                 data-index="${index}" data-field="startM" 
                 onfocus="this.select()"
                 onkeyup="handleTimeInput(this, 'endH-${index}')">
          
          <span class="text-gray-500 text-sm font-mono mx-1">-</span>

          <input type="number" id="endH-${index}" min="0" max="23" placeholder="00" value="${row.endH}" 
                 class="w-7 bg-transparent text-center text-gray-200 text-sm font-mono outline-none" 
                 data-index="${index}" data-field="endH" 
                 onfocus="this.select()"
                 onkeyup="handleTimeInput(this, 'endM-${index}')">
          <span class="text-gray-400 text-sm font-mono mx-0.5">:</span>
          
          <input type="number" id="endM-${index}" min="0" max="59" placeholder="00" value="${row.endM}" 
                 class="w-7 bg-transparent text-center text-gray-200 text-sm font-mono outline-none" 
                 data-index="${index}" data-field="endM" 
                 onfocus="this.select()"
                 onkeyup="handleTimeInput(this, null)">
          
        </div>
        
        <button class="text-red-400 hover:text-red-300 p-1 flex-shrink-0 transition-colors" onclick="removeTimeRow(${index})">
          <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
          </svg>
        </button>
      </div>
    `;
  }).join('');

  timeRowsContainer.querySelectorAll('select, input[type="number"]').forEach(el => {
    el.addEventListener('change', (e) => {
      const index = e.target.dataset.index;
      const field = e.target.dataset.field;
      let val = e.target.value;
      
      if (field === 'pair') {
        const inst = INSTRUMENTS.find(i => i.pair === val);
        tempTimeRows[index].pair = val;
        if (inst) tempTimeRows[index].type = inst.type;
      } else {
        if (val.length === 1) val = '0' + val;
        tempTimeRows[index][field] = val;
      }
    });
  });
}

window.toggleCheck = function(index, isChecked) {
  if (tempTimeRows[index]) {
    tempTimeRows[index].isChecked = isChecked;
  }
};

// AVTOMATIK O'TISH VA TO'G'RILASH (Faqat 2 ta raqam kiritilganda ishlaydi)
window.handleTimeInput = function(el, nextId) {
  let val = el.value;
  const index = el.dataset.index;
  const field = el.dataset.field;

  // 2 tadan ko'p raqam kiritilmasin
  if (val.length > 2) {
    val = val.slice(0, 2);
    el.value = val;
  }

  // Chegaradan oshib ketsa to'g'rilash
  if (field.includes('H') && parseInt(val) > 23) { el.value = '23'; val = '23'; }
  if (field.includes('M') && parseInt(val) > 59) { el.value = '59'; val = '59'; }

  // Agar 2 ta raqam yozilgan bo'lsa, keyingi katakka o'tish
  if (val.length === 2 && nextId) {
    const nextInput = document.getElementById(nextId);
    if (nextInput) {
      nextInput.focus();
      nextInput.select(); // Keyingi katakdagi matnni belgilab qo'yish (oson almashtirish uchun)
    }
  }

  // Ma'lumotni yangilash
  if (tempTimeRows[index]) {
    tempTimeRows[index][field] = val.padStart(2, '0');
  }
};

window.removeTimeRow = function(index) {
  const confirmDelete = confirm("Ushbu vaqt oralig'ini o'chirishni tasdiqlaysizmi?");
  if (confirmDelete) {
    tempTimeRows.splice(index, 1);
    renderTimeRows();
  }
}

addTimeBtn.addEventListener('click', () => {
  const uniquePairs = [...new Set(INSTRUMENTS.map(i => i.pair))];
  const defaultPair = uniquePairs[0];
  const inst = INSTRUMENTS.find(i => i.pair === defaultPair);

  if (tempTimeRows.length < 20) {
    tempTimeRows.push({ 
      pair: defaultPair, 
      type: inst ? inst.type : 'Forex', 
      startH: '00', startM: '00', endH: '00', endM: '00',
      isChecked: false 
    });
    renderTimeRows();
  }
});

menuBtn.addEventListener('click', openMenuSheet);
menuOverlay.addEventListener('click', closeMenuSheet);

saveMenuBtn.addEventListener('click', () => {
  let newInstruments = [];
  const grouped = {};
  
  tempTimeRows.forEach(row => {
    if (row.startH === '00' && row.startM === '00' && row.endH === '00' && row.endM === '00') return;
    const timeString = `${row.startH}:${row.startM} - ${row.endH}:${row.endM}`;

    if (!grouped[row.pair]) {
      grouped[row.pair] = { type: row.type, pair: row.pair, times: [], isVisible: row.isChecked };
    } else {
      if (row.isChecked) grouped[row.pair].isVisible = true;
    }
    grouped[row.pair].times.push(timeString);
  });

  Object.values(grouped).forEach(group => {
    group.times = group.times.slice(0, 3);
    newInstruments.push(group);
  });

  const currentOrder = INSTRUMENTS.map(i => i.pair);
  let finalInstruments = [];
  
  currentOrder.forEach(pair => {
    const found = newInstruments.find(i => i.pair === pair);
    if (found) finalInstruments.push(found);
  });
  
  newInstruments.forEach(inst => {
    if (!finalInstruments.find(i => i.pair === inst.pair)) {
      finalInstruments.push(inst);
    }
  });

  INSTRUMENTS = finalInstruments;
  
  const existingTypes = [...new Set(INSTRUMENTS.map(i => i.type))];
  currentFilterTypes = currentFilterTypes.filter(t => existingTypes.includes(t));

  saveToLocalStorage(); // Sozlamalar va vaqtlar saqlandi
  renderInstrumentList();
  closeMenuSheet();
});

function renderRuler(){
  const wrap = document.getElementById('rulerWrap');
  wrap.innerHTML = '';
  for (let utc = 0; utc < 24; utc++){
    const liq = liquidityAt(utc);
    const seg = document.createElement('div');
    seg.className = `ruler-seg liq-${liq}`;
    seg.id = `seg-${utc}`;
    if (selectedHour !== null && utc === selectedHour) seg.classList.add('active');
    seg.dataset.utc = utc;
    seg.title = formatTimeInterval(utc);
    wrap.appendChild(seg);
  }
  
  if (selectedHour !== null) wrap.classList.add('has-active');
  else wrap.classList.remove('has-active');
}

function updateTimeBadge(){
  const badge = document.getElementById('timeBadge');
  if (selectedHour === null) {
    const now = new Date();
    badge.textContent = formatTimeInterval(now.getUTCHours());
    badge.className = 'text-sm font-mono font-semibold bg-gray-700 text-gray-300 px-3 py-1 rounded-lg border border-gray-600 transition-colors hover:bg-gray-600 focus:outline-none cursor-default';
  } else {
    badge.textContent = formatTimeInterval(selectedHour);
    badge.className = 'text-sm font-mono font-semibold bg-brand-500 text-white px-3 py-1 rounded-lg border border-brand-500 transition-colors hover:bg-brand-600 focus:outline-none cursor-pointer';
  }
}

document.getElementById('timeBadge').addEventListener('click', () => {
  if (selectedHour !== null) {
    selectedHour = null;
    renderRuler();
    updateTimeBadge();
    requestAnimationFrame(() => setTimeout(updateNowLine, 10));
  }
});

function updateNowLine(){
  const line = document.getElementById('nowLine');
  const baseContainer = document.getElementById('baseContainer');
  const now = new Date();
  const utcHours = now.getUTCHours();
  const currentSeg = document.getElementById(`seg-${utcHours}`);
  
  if (currentSeg) {
    const segRect = currentSeg.getBoundingClientRect();
    const baseRect = baseContainer.getBoundingClientRect();
    line.style.left = `${segRect.left - baseRect.left}px`;
    line.style.width = `${segRect.width}px`;
  }
}

const rulerWrap = document.getElementById('rulerWrap');
let isDragging = false;
let lastSelectedHour = null;

function getHourFromX(clientX) {
  const segments = document.querySelectorAll('.ruler-seg');
  for (let i = 0; i < segments.length; i++) {
    const rect = segments[i].getBoundingClientRect();
    if (clientX >= rect.left && clientX <= rect.right) return parseInt(segments[i].dataset.utc);
  }
  if (clientX < segments[0].getBoundingClientRect().left) return 0;
  if (clientX > segments[23].getBoundingClientRect().right) return 23;
  return null;
}

function startDrag(e) {
  if (e.type === 'touchstart') {
    e.preventDefault();
  }
  
  isDragging = true;
  const x = e.touches ? e.touches[0].clientX : e.clientX;
  const hour = getHourFromX(x);
  
  if (hour !== null) {
    if (selectedHour === hour) {
      selectedHour = null; 
    } else {
      selectedHour = hour;
    }
    lastSelectedHour = hour;
    renderRuler(); 
    updateTimeBadge();
    requestAnimationFrame(() => setTimeout(updateNowLine, 10));
  }
}

function onDrag(e) {
  if (!isDragging) return;
  if (e.cancelable) e.preventDefault(); 
  const x = e.touches ? e.touches[0].clientX : e.clientX;
  const hour = getHourFromX(x);
  if (hour !== null && hour !== lastSelectedHour) {
    selectedHour = hour; 
    lastSelectedHour = hour;
    renderRuler(); 
    updateTimeBadge();
    requestAnimationFrame(() => setTimeout(updateNowLine, 10));
  }
}

function endDrag() { isDragging = false; }

rulerWrap.addEventListener('mousedown', startDrag);
rulerWrap.addEventListener('mousemove', onDrag);
window.addEventListener('mouseup', endDrag);
rulerWrap.addEventListener('touchstart', startDrag, { passive: false });
rulerWrap.addEventListener('touchmove', onDrag, { passive: false });
window.addEventListener('touchend', endDrag);

function renderInstrumentList(){
  const list = document.getElementById('instrumentList');
  
  if (currentFilterTypes.length === 0) {
    list.innerHTML = `<div class="text-center text-gray-500 py-8 text-sm font-medium">Filtrda hech narsa tanlanmagan</div>`;
    return;
  }

  const items = INSTRUMENTS.filter(i => 
    currentFilterTypes.includes(i.type) && i.isVisible !== false
  );
  
  if (items.length === 0) {
    list.innerHTML = `<div class="text-center text-gray-500 py-4 text-sm">Tanlangan guruhda instrumentlar yo'q</div>`;
    return;
  }

  const now = new Date();
  let currentMinutes = ((now.getUTCHours() + tzOffset) * 60 + now.getUTCMinutes() + 1440) % 1440;

  list.innerHTML = items.map((i) => {
    let timeStr = i.times.map(t => `<div>${t}</div>`).join('');

    let isActive = false;
    if (i.times && i.times.length > 0) {
      for (const time of i.times) {
        if (isTimeInRange(time, currentMinutes)) {
          isActive = true;
          break;
        }
      }
    }

    const indicatorHtml = isActive 
      ? `<span class="w-2.5 h-2.5 bg-green-500 rounded-full mr-2 flex-shrink-0 pulse-dot-active"></span>` 
      : `<span class="w-2.5 h-2.5 bg-gray-500 rounded-full mr-2 flex-shrink-0"></span>`;

    const dragHandleHtml = isSorting 
      ? `<div class="drag-handle cursor-grab active:cursor-grabbing pr-2 text-gray-400 hover:text-white flex-shrink-0">
           <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
             <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 8h16M4 16h16" />
           </svg>
         </div>` 
      : '';

    return `
      <div class="sortable-item bg-gray-700/50 border border-gray-700 rounded-xl" data-pair="${i.pair}">
        <div class="flex flex-row items-center justify-between gap-2 px-3 py-2">
          <div class="min-w-0 flex-1 flex items-center">
            ${dragHandleHtml}
            ${indicatorHtml}
            <p class="font-bold text-base text-white truncate">${i.pair}</p>
          </div>
          <div class="flex-shrink-0">
            <div class="flex flex-col text-sm font-mono font-bold text-gray-200 bg-gray-800 px-2 py-1 rounded-lg border border-gray-600">
              ${timeStr}
            </div>
          </div>
        </div>
      </div>
    `;
  }).join('');
}

(function init(){
  tzOffset = -new Date().getTimezoneOffset() / 60;
  renderInstrumentList();
  renderRuler();
  updateTimeBadge();
  setTimeout(updateNowLine, 100);
  setInterval(() => updateNowLine(), 1000);
  setInterval(() => {
    if (selectedHour === null) {
      updateTimeBadge();
    }
    renderInstrumentList();
  }, 60000);
  window.addEventListener('resize', updateNowLine);
})();
</script>
</body>
