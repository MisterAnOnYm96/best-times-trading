<!DOCTYPE html>
<html lang="uz" class="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Eng yaxshi trading vaqtlari</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    darkMode: 'class',
    theme: {
      extend: { colors: { brand: { 500: '#3b82f6', 600: '#2563eb' } } }
    }
  }
</script>
<style>
  /* ===== TIMELINE RULER ===== */
  .ruler-wrap { 
    display: flex; 
    align-items: flex-end; 
    gap: 2px; 
    height: 60px; 
    padding: 4px 0 0 0; 
    overflow: visible; 
    position: relative;
    margin-bottom: 6px; 
    touch-action: none;
    user-select: none;
  }
  
  .ruler-seg {
    flex: 1 1 0; 
    min-width: 0; 
    border-radius: 3px 3px 0 0; 
    position: relative;
    cursor: pointer; 
    transition: flex .35s cubic-bezier(.4,0,.2,1), opacity .35s, filter .2s; 
    display: flex;
    flex-direction: column; 
    justify-content: center; 
    align-items: center; 
    user-select: none;
  }
  .ruler-seg:hover { filter: brightness(1.08); }

  .ruler-seg.liq-low     { height: 15px; }
  .ruler-seg.liq-medium  { height: 25px; }
  .ruler-seg.liq-high    { height: 35px; }
  .ruler-seg.liq-overlap { height: 45px; }

  .ruler-seg.active {
    flex: 3 1 0; 
    z-index: 10; 
    box-shadow: 0 2px 8px rgba(0,0,0,.4);
    border-radius: 4px 4px 0 0; 
  }
  
  .ruler-wrap.has-active .ruler-seg:not(.active) { 
    flex: 0.6 1 0; 
    opacity: .4; 
  }

  .now-line-container {
    position: relative;
    width: 100%;
    height: 6px;
  }
  
  .now-line {
    position: absolute;
    top: 0; 
    height: 4px;
    background: #3b82f6;
    border-radius: 4px;
    z-index: 20;
    box-shadow: 0 0 6px rgba(59,130,246,.6);
    transition: left 0.35s cubic-bezier(.4,0,.2,1), width 0.35s cubic-bezier(.4,0,.2,1);
  }

  .liq-overlap { background: linear-gradient(180deg,#34d399,#059669); }
  .liq-high    { background: #22c55e; }
  .liq-medium  { background: #facc15; color:#3f3f46; }
  .liq-low     { background: #cbd5e1; color:#64748b; }
  .dark .liq-low { background: #475569; color:#cbd5e1; }

  /* ===== BOTTOM SHEET ANIMATSIYASI ===== */
  .sheet-overlay { transition: opacity 0.3s ease-in-out; }
  .sheet-content { transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
  .filter-tag { transition: all 0.2s ease; }
</style>
</head>
<body class="bg-gray-900 text-gray-100 transition-colors overflow-hidden">

<!-- HEADER -->
<header class="bg-gray-800 shadow-sm sticky top-0 z-30">
  <div class="max-w-6xl mx-auto px-4 py-3 flex items-center justify-between">
    <h1 class="font-bold text-lg">📊 Trading Times</h1>
    
    <div class="flex items-center gap-1">
      <!-- Filtr tugmasi -->
      <button id="filterBtn" class="p-2 text-gray-400 hover:text-white rounded-lg hover:bg-gray-700 transition-colors" title="Filtr">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M3 4a1 1 0 011-1h16a1 1 0 011 1v2.586a1 1 0 01-.293.707l-6.414 6.414a1 1 0 00-.293.707V17l-4 4v-6.586a1 1 0 00-.293-.707L3.293 7.293A1 1 0 013 6.586V4z" />
        </svg>
      </button>
      
      <!-- 3 ta nuqta (Sozlamalar) -->
      <button id="menuBtn" class="p-2 text-gray-400 hover:text-white rounded-lg hover:bg-gray-700 transition-colors" title="Sozlamalar">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M12 5v.01M12 12v.01M12 19v.01M12 6a1 1 0 110-2 1 1 0 010 2zm0 7a1 1 0 110-2 1 1 0 010 2zm0 7a1 1 0 110-2 1 1 0 010 2z" />
        </svg>
      </button>
    </div>
  </div>
</header>

<main class="max-w-6xl mx-auto px-4 py-6 space-y-8 overflow-y-auto h-[calc(100vh-60px)]">

  <!-- KUNLIK TIMELINE RULER -->
  <section class="bg-gray-800 rounded-2xl p-4 shadow-sm text-gray-100">
    
    <div class="flex flex-wrap items-center justify-between gap-2 mb-3">
      <h3 class="font-bold text-base">Likvidlik shkalasi</h3>
      
      <button id="timeBadge" class="text-sm font-mono font-semibold bg-gray-700 text-gray-300 px-3 py-1 rounded-lg border border-gray-600 transition-colors hover:bg-gray-600 focus:outline-none">
        --:-- - --:--
      </button>
    </div>

    <div id="rulerWrap" class="ruler-wrap"></div>
    
    <div class="now-line-container" id="baseContainer">
      <div id="nowLine" class="now-line"></div>
    </div>
  </section>

  <!-- JUFTLIKLAR BO'YICHA -->
  <section class="bg-gray-800 rounded-2xl p-4 shadow-sm">
    <h3 class="font-bold mb-3">Instrument bo'yicha eng yaxshi vaqtlar</h3>
    <div id="instrumentList" class="space-y-3"></div>
  </section>

</main>

<footer class="text-center text-xs text-gray-500 py-6">
  Ma'lumotlar taxminiy. Trading qarorlaringizni o'zingiz qabul qiling.
</footer>

<!-- ===== FILTR BOTTOM SHEET ===== -->
<div id="filterSheet" class="fixed inset-0 z-50 pointer-events-none">
  <div id="sheetOverlay" class="absolute inset-0 bg-black/60 opacity-0 sheet-overlay pointer-events-none"></div>
  
  <div id="sheetContent" class="absolute bottom-0 left-0 right-0 bg-gray-800 rounded-t-3xl p-5 transform translate-y-full sheet-content pointer-events-auto shadow-2xl border-t border-gray-700">
    
    <!-- Guruhlar ro'yxati (teng bo'lingan) -->
    <div id="filterGroups" class="flex gap-2 mb-6 w-full">
      <!-- JS tomonidan to'ldiriladi -->
    </div>
    
    <!-- Saqlash tugmasi -->
    <button id="saveFilterBtn" class="w-full bg-brand-500 hover:bg-brand-600 text-white font-bold py-3 rounded-xl transition-colors">
      Saqlash
    </button>
  </div>
</div>

<!-- ===== SOZLAMALAR (VAQT QO'SHISH) MODAL OYNASI ===== -->
<div id="settingsModal" class="fixed inset-0 z-50 pointer-events-none">
  <div id="settingsOverlay" class="absolute inset-0 bg-black/70 opacity-0 sheet-overlay pointer-events-none"></div>
  
  <div id="settingsContent" class="absolute top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 scale-95 opacity-0 w-full max-w-md bg-gray-800 rounded-2xl p-5 shadow-2xl border border-gray-700 pointer-events-auto transition-all duration-300 flex flex-col max-h-[90vh]">
    
    <h3 class="text-lg font-bold mb-4 text-center">Vaqtni sozlash</h3>

    <!-- Qo'shilgan vaqtlar ro'yxati -->
    <div id="addedTimesList" class="overflow-y-auto mb-4 space-y-2 flex-1">
      <!-- JS tomonidan to'ldiriladi -->
    </div>

    <!-- Kiritish qismi -->
    <div class="flex gap-2 mb-3">
      <!-- Chap ustun: Instrument -->
      <div class="w-1/2">
        <label class="text-xs text-gray-400 mb-1 block">Instrument</label>
        <select id="instSelect" class="w-full bg-gray-700 border border-gray-600 text-white text-sm rounded-lg p-2.5 outline-none focus:border-brand-500">
          <!-- JS tomonidan to'ldiriladi -->
        </select>
      </div>

      <!-- O'ng ustun: Vaqt -->
      <div class="w-1/2">
        <label class="text-xs text-gray-400 mb-1 block">Vaqt (UTC)</label>
        <input type="time" id="timeInput" class="w-full bg-gray-700 border border-gray-600 text-white text-sm rounded-lg p-2.5 outline-none focus:border-brand-500" placeholder="00:00">
      </div>
    </div>

    <!-- Qo'shish tugmasi -->
    <button id="addTimeBtn" class="w-full bg-green-600 hover:bg-green-500 text-white font-bold py-2.5 rounded-lg mb-4 transition-colors">
      + Qo'shish
    </button>

    <!-- Eng pastda Saqlash -->
    <button id="saveSettingsBtn" class="w-full bg-brand-500 hover:bg-brand-600 text-white font-bold py-3 rounded-xl transition-colors">
      Saqlash
    </button>
  </div>
</div>

<script>
// ================== MA'LUMOTLAR ==================
let INSTRUMENTS = [
  { type: 'Forex', pair: 'EURUSD', name: 'EURO / US DOLLAR', times: [1, 12] },
  { type: 'Forex', pair: 'USDCAD', name: 'US DOLLAR / CANADIAN DOLLAR', times: [12] },
  { type: 'Forex', pair: 'USDJPY', name: 'US DOLLAR / JAPANESE YEN', times: [12] },
  { type: 'Forex', pair: 'GBPJPY', name: 'BRITISH POUND / JAPANESE YEN', times: [4] },
  { type: 'Metall', pair: 'XAUUSD', name: 'GOLD', times: [7] },
  { type: 'Indeks', pair: 'US30', name: 'DOW JONES', times: [1, 11.5] },
  { type: 'Forex', pair: 'AUDUSD', name: 'AUSTRALIAN DOLLAR / US DOLLAR', times: [23, 12] },
];

// ================== HOLAT ==================
let tzOffset = -new Date().getTimezoneOffset() / 60; 
let selectedHour = null;
let expandedInstrument = null; 
let currentFilterTypes = ['Forex', 'Metall', 'Indeks']; 
let tempFilterTypes = [...currentFilterTypes];

// Sozlamalar oynasi uchun vaqtinchalik ma'lumotlar
let tempInstruments = [];

// ================== YORDAMCHI ==================
function pad(n){ return String(Math.floor(n)).padStart(2,'0'); }

function formatTimeInterval(startUtcH) {
  let localStart = (startUtcH + tzOffset) % 24;
  if (localStart < 0) localStart += 24;
  let localEnd = (startUtcH + 1 + tzOffset) % 24;
  if (localEnd < 0) localEnd += 24;
  
  let hStart = Math.floor(localStart);
  let mStart = Math.round((localStart - hStart) * 60);
  
  let hEnd = Math.floor(localEnd);
  let mEnd = Math.round((localEnd - hEnd) * 60);
  
  let displayEnd = '';
  if (mEnd === 0) {
    let prevHour = (hEnd - 1 + 24) % 24;
    displayEnd = `${pad(prevHour)}:59`;
  } else {
    displayEnd = `${pad(hEnd)}:${pad(mEnd)}`;
  }

  return `${pad(hStart)}:${pad(mStart)} - ${displayEnd}`;
}

// 12:30 kabi vaqtni UTC soatga o'girish
function timeToUtcFloat(timeStr) {
  const [h, m] = timeStr.split(':').map(Number);
  return h + (m / 60);
}

// UTC soatni 12:30 ga o'girish
function utcFloatToTimeStr(utcH) {
  let h = Math.floor(utcH);
  let m = Math.round((utcH - h) * 60);
  return `${pad(h)}:${pad(m)}`;
}

function liquidityAt(utcHour){
  const london = utcHour >= 7 && utcHour < 16;
  const ny = utcHour >= 12 && utcHour < 21;
  const tokyo = utcHour >= 0 && utcHour < 9;
  if (london && ny) return 'overlap';
  if (london || ny) return 'high';
  if (tokyo) return 'medium';
  return 'low';
}

// ================== RENDER: RULER ==================
function renderRuler(){
  const wrap = document.getElementById('rulerWrap');
  wrap.innerHTML = '';
  for (let utc = 0; utc < 24; utc++){
    const liq = liquidityAt(utc);
    const seg = document.createElement('div');
    seg.className = `ruler-seg liq-${liq}`;
    seg.id = `seg-${utc}`;
    if (selectedHour !== null && utc === selectedHour) seg.classList.add('active');
    seg.dataset.utc = utc;
    seg.title = formatTimeInterval(utc);
    wrap.appendChild(seg);
  }
  if (selectedHour !== null) wrap.classList.add('has-active');
  else wrap.classList.remove('has-active');
}

// ================== VAQT KATAKCHASI ==================
function updateTimeBadge(){
  const badge = document.getElementById('timeBadge');
  if (selectedHour === null) {
    const now = new Date();
    const utcH = now.getUTCHours();
    badge.textContent = formatTimeInterval(utcH);
    badge.className = 'text-sm font-mono font-semibold bg-gray-700 text-gray-300 px-3 py-1 rounded-lg border border-gray-600 transition-colors hover:bg-gray-600 focus:outline-none cursor-default';
  } else {
    badge.textContent = formatTimeInterval(selectedHour);
    badge.className = 'text-sm font-mono font-semibold bg-brand-500 text-white px-3 py-1 rounded-lg border border-brand-500 transition-colors hover:bg-brand-600 focus:outline-none cursor-pointer';
  }
}

document.getElementById('timeBadge').addEventListener('click', () => {
  if (selectedHour !== null) {
    selectedHour = null;
    renderRuler();
    updateTimeBadge();
    requestAnimationFrame(() => setTimeout(updateNowLine, 10));
  }
});

// ================== HOZIRGI VAQT BELGISI ==================
function updateNowLine(){
  const line = document.getElementById('nowLine');
  const baseContainer = document.getElementById('baseContainer');
  const now = new Date();
  const utcHours = now.getUTCHours();
  const currentSeg = document.getElementById(`seg-${utcHours}`);
  
  if (currentSeg) {
    const segRect = currentSeg.getBoundingClientRect();
    const baseRect = baseContainer.getBoundingClientRect();
    const leftOffset = segRect.left - baseRect.left;
    const width = segRect.width;
    line.style.left = `${leftOffset}px`;
    line.style.width = `${width}px`;
  }
}

// ================== DRAG / SWIPE ==================
const rulerWrap = document.getElementById('rulerWrap');
let isDragging = false;
let lastSelectedHour = null;

function getHourFromX(clientX) {
  const segments = document.querySelectorAll('.ruler-seg');
  for (let i = 0; i < segments.length; i++) {
    const rect = segments[i].getBoundingClientRect();
    if (clientX >= rect.left && clientX <= rect.right) {
      return parseInt(segments[i].dataset.utc);
    }
  }
  if (clientX < segments[0].getBoundingClientRect().left) return 0;
  if (clientX > segments[23].getBoundingClientRect().right) return 23;
  return null;
}

function startDrag(e) {
  isDragging = true;
  const x = e.touches ? e.touches[0].clientX : e.clientX;
  const hour = getHourFromX(x);
  if (hour !== null) {
    selectedHour = hour;
    lastSelectedHour = hour;
    renderRuler();
    updateTimeBadge();
    requestAnimationFrame(() => setTimeout(updateNowLine, 10));
  }
}

function onDrag(e) {
  if (!isDragging) return;
  if (e.cancelable) e.preventDefault(); 
  const x = e.touches ? e.touches[0].clientX : e.clientX;
  const hour = getHourFromX(x);
  if (hour !== null && hour !== lastSelectedHour) {
    selectedHour = hour;
    lastSelectedHour = hour;
    renderRuler();
    updateTimeBadge();
    requestAnimationFrame(() => setTimeout(updateNowLine, 10));
  }
}

function endDrag() { isDragging = false; }

rulerWrap.addEventListener('mousedown', startDrag);
rulerWrap.addEventListener('mousemove', onDrag);
window.addEventListener('mouseup', endDrag);
rulerWrap.addEventListener('touchstart', startDrag, { passive: false });
rulerWrap.addEventListener('touchmove', onDrag, { passive: false });
window.addEventListener('touchend', endDrag);

// ================== FILTR OYNASI ==================
const filterSheet = document.getElementById('filterSheet');
const sheetOverlay = document.getElementById('sheetOverlay');
const sheetContent = document.getElementById('sheetContent');
const filterBtn = document.getElementById('filterBtn');
const saveFilterBtn = document.getElementById('saveFilterBtn');
const filterGroups = document.getElementById('filterGroups');

function openFilterSheet() {
  const types = [...new Set(INSTRUMENTS.map(i => i.type))];
  tempFilterTypes = [...currentFilterTypes];
  
  filterGroups.innerHTML = types.map(t => {
    const isSelected = tempFilterTypes.includes(t);
    return `
      <button class="filter-tag flex-1 px-2 py-2 rounded-lg font-medium text-sm border ${isSelected ? 'bg-brand-500 border-brand-500 text-white' : 'bg-gray-700 border-gray-600 text-gray-300'}" data-type="${t}">
        ${t}
      </button>
    `;
  }).join('');

  document.querySelectorAll('.filter-tag').forEach(btn => {
    btn.addEventListener('click', () => {
      const type = btn.dataset.type;
      if (tempFilterTypes.includes(type)) {
        if (tempFilterTypes.length > 1) {
          tempFilterTypes = tempFilterTypes.filter(t => t !== type);
          btn.classList.remove('bg-brand-500', 'border-brand-500', 'text-white');
          btn.classList.add('bg-gray-700', 'border-gray-600', 'text-gray-300');
        }
      } else {
        tempFilterTypes.push(type);
        btn.classList.add('bg-brand-500', 'border-brand-500', 'text-white');
        btn.classList.remove('bg-gray-700', 'border-gray-600', 'text-gray-300');
      }
    });
  });

  filterSheet.classList.remove('pointer-events-none');
  sheetOverlay.classList.remove('opacity-0', 'pointer-events-none');
  sheetContent.classList.remove('translate-y-full');
}

function closeFilterSheet() {
  sheetOverlay.classList.add('opacity-0', 'pointer-events-none');
  sheetContent.classList.add('translate-y-full');
  setTimeout(() => { filterSheet.classList.add('pointer-events-none'); }, 300);
}

filterBtn.addEventListener('click', openFilterSheet);
sheetOverlay.addEventListener('click', closeFilterSheet);

saveFilterBtn.addEventListener('click', () => {
  currentFilterTypes = [...tempFilterTypes];
  renderInstrumentList(); 
  closeFilterSheet();
});

// ================== SOZLAMALAR (VAQT QO'SHISH) ==================
const settingsModal = document.getElementById('settingsModal');
const settingsOverlay = document.getElementById('settingsOverlay');
const settingsContent = document.getElementById('settingsContent');
const menuBtn = document.getElementById('menuBtn');
const saveSettingsBtn = document.getElementById('saveSettingsBtn');
const addTimeBtn = document.getElementById('addTimeBtn');
const instSelect = document.getElementById('instSelect');
const timeInput = document.getElementById('timeInput');
const addedTimesList = document.getElementById('addedTimesList');

function openSettingsModal() {
  // Chuqur nusxa olamiz
  tempInstruments = JSON.parse(JSON.stringify(INSTRUMENTS));
  
  // Selectni to'ldirish
  instSelect.innerHTML = tempInstruments.map(i => `<option value="${i.pair}">${i.pair} (${i.name})</option>`).join('');
  
  renderAddedTimes();
  
  settingsModal.classList.remove('pointer-events-none');
  settingsOverlay.classList.remove('opacity-0', 'pointer-events-none');
  settingsContent.classList.remove('scale-95', 'opacity-0');
}

function closeSettingsModal() {
  settingsOverlay.classList.add('opacity-0', 'pointer-events-none');
  settingsContent.classList.add('scale-95', 'opacity-0');
  setTimeout(() => { settingsModal.classList.add('pointer-events-none'); }, 300);
}

function renderAddedTimes() {
  let html = '';
  tempInstruments.forEach(inst => {
    if (inst.times.length > 0) {
      html += `<div class="mb-2">
        <div class="text-xs text-brand-500 font-bold mb-1">${inst.pair}</div>
        <div class="flex flex-wrap gap-1">`;
      inst.times.forEach((time, idx) => {
        html += `<div class="flex items-center gap-1 bg-gray-700 text-gray-200 text-sm px-2 py-1 rounded border border-gray-600">
          ${utcFloatToTimeStr(time)}
          <button class="text-red-400 hover:text-red-300 ml-1 delete-time-btn" data-pair="${inst.pair}" data-idx="${idx}">
            &times;
          </button>
        </div>`;
      });
      html += `</div></div>`;
    }
  });
  addedTimesList.innerHTML = html || '<div class="text-center text-gray-500 text-sm py-4">Hozircha vaqt qo\'shilmagan</div>';

  // O'chirish tugmalari
  document.querySelectorAll('.delete-time-btn').forEach(btn => {
    btn.addEventListener('click', (e) => {
      const pair = e.target.dataset.pair;
      const idx = parseInt(e.target.dataset.idx);
      const inst = tempInstruments.find(i => i.pair === pair);
      if (inst) {
        inst.times.splice(idx, 1);
        renderAddedTimes();
      }
    });
  });
}

menuBtn.addEventListener('click', openSettingsModal);
settingsOverlay.addEventListener('click', closeSettingsModal);

// Vaqt qo'shish
addTimeBtn.addEventListener('click', () => {
  const pair = instSelect.value;
  const timeVal = timeInput.value;
  
  if (!timeVal) {
    alert('Iltimos, vaqtni kiriting!');
    return;
  }
  
  const inst = tempInstruments.find(i => i.pair === pair);
  if (inst) {
    if (inst.times.length >= 3) {
      alert('Bitta instrumentga 3 tadan ko\'p vaqt qo\'shib bo\'lmaydi!');
      return;
    }
    // Vaqtni UTC ga o'girish
    const utcH = timeToUtcFloat(timeVal);
    inst.times.push(utcH);
    inst.times.sort((a, b) => a - b); // Tartiblash
    timeInput.value = '';
    renderAddedTimes();
  }
});

// Saqlash (Sozlamalar)
saveSettingsBtn.addEventListener('click', () => {
  INSTRUMENTS = JSON.parse(JSON.stringify(tempInstruments));
  renderInstrumentList(); 
  closeSettingsModal();
});

// ================== INSTRUMENTLAR ==================
function renderInstrumentList(){
  const list = document.getElementById('instrumentList');
  const items = INSTRUMENTS.filter(i => currentFilterTypes.includes(i.type));
  
  if (items.length === 0) {
    list.innerHTML = `<div class="text-center text-gray-500 py-4 text-sm">Tanlangan guruhda instrumentlar yo'q</div>`;
    return;
  }

  list.innerHTML = items.map((i, index) => {
    let timeStr = '';
    if (i.times.length > 0) {
      // Vaqtlarni guruhlash
      i.times.forEach(t => {
        timeStr += `<div>${formatTimeInterval(t)}</div>`;
      });
    } else {
      timeStr = `<div class="text-gray-500 text-xs">Vaqt yo'q</div>`;
    }

    const isExpanded = expandedInstrument === i.pair;

    return `
      <div class="bg-gray-700/50 border border-gray-700 rounded-xl overflow-hidden transition-all duration-300">
        <div class="inst-header flex flex-row items-center justify-between gap-3 p-4 cursor-pointer hover:bg-gray-700/80 transition-colors" data-pair="${i.pair}">
          <div class="min-w-0 flex-1">
            <p class="font-bold text-base text-white">${i.pair}</p>
          </div>
          <div class="flex-shrink-0">
            <div class="flex flex-col text-sm font-mono font-bold text-gray-200 bg-gray-800 px-3 py-1.5 rounded-lg border border-gray-600">
              ${timeStr}
            </div>
          </div>
        </div>

        <div class="inst-body px-4 overflow-hidden transition-all duration-300 ${isExpanded ? 'max-h-20 pb-4 opacity-100' : 'max-h-0 opacity-0'}">
          <p class="text-sm text-gray-400 uppercase tracking-wide">${i.name}</p>
        </div>
      </div>
    `;
  }).join('');

  document.querySelectorAll('.inst-header').forEach(header => {
    header.addEventListener('click', () => {
      const pair = header.dataset.pair;
      expandedInstrument = (expandedInstrument === pair) ? null : pair;
      renderInstrumentList();
    });
  });
}

// ================== INIT ==================
(function init(){
  tzOffset = -new Date().getTimezoneOffset() / 60;
  renderInstrumentList();
  renderRuler();
  updateTimeBadge();
  
  setTimeout(updateNowLine, 100);
  setInterval(() => { updateNowLine(); }, 1000);
  setInterval(() => { if (selectedHour === null) updateTimeBadge(); }, 60000);
  window.addEventListener('resize', updateNowLine);
})();
</script>
</body>
</html>
