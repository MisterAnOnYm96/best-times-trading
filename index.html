<!DOCTYPE html>
<html lang="uz" class="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Eng yaxshi trading vaqtlari</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    darkMode: 'class',
    theme: {
      extend: { colors: { brand: { 500: '#3b82f6', 600: '#2563eb' } } }
    }
  }
</script>
<style>
  /* ===== TIMELINE RULER ===== */
  .ruler-wrap { 
    display: flex; 
    align-items: flex-end; 
    gap: 2px; /* Ustunlar orasi */
    height: 60px; 
    padding: 4px 0 0 0; 
    overflow: visible; 
    position: relative;
    margin-bottom: 6px; 
  }
  
  .ruler-seg {
    flex: 1 1 0; 
    min-width: 0; 
    border-radius: 3px 3px 0 0; 
    position: relative;
    cursor: pointer; 
    transition: flex .35s cubic-bezier(.4,0,.2,1), opacity .35s, filter .2s; 
    display: flex;
    flex-direction: column; 
    justify-content: center; 
    align-items: center; 
    user-select: none;
  }
  .ruler-seg:hover { filter: brightness(1.08); }

  /* Balandliklar */
  .ruler-seg.liq-low     { height: 15px; }
  .ruler-seg.liq-medium  { height: 25px; }
  .ruler-seg.liq-high    { height: 35px; }
  .ruler-seg.liq-overlap { height: 45px; }

  /* Kattalashgan segment */
  .ruler-seg.active {
    flex: 3 1 0; 
    z-index: 10; 
    box-shadow: 0 2px 8px rgba(0,0,0,.4);
    border-radius: 4px 4px 0 0; 
  }
  
  .ruler-wrap.has-active .ruler-seg:not(.active) { 
    flex: 0.6 1 0; 
    opacity: .4; 
  }

  /* Hozirgi vaqt ko'rsatkichi */
  .now-line-container {
    position: relative;
    width: 100%;
    height: 6px;
  }
  
  .now-line {
    position: absolute;
    top: 0; 
    height: 4px;
    background: #3b82f6;
    border-radius: 4px;
    z-index: 20;
    box-shadow: 0 0 6px rgba(59,130,246,.6);
    /* Silliq o'tish uchun */
    transition: left 0.35s cubic-bezier(.4,0,.2,1), width 0.35s cubic-bezier(.4,0,.2,1), opacity 0.35s;
  }

  /* Ranglar */
  .liq-overlap { background: linear-gradient(180deg,#34d399,#059669); }
  .liq-high    { background: #22c55e; }
  .liq-medium  { background: #facc15; color:#3f3f46; }
  .liq-low     { background: #cbd5e1; color:#64748b; }
  .dark .liq-low { background: #475569; color:#cbd5e1; }
</style>
</head>
<body class="bg-gray-900 text-gray-100 transition-colors">

<!-- HEADER (Vaqt tanlash olib tashlandi) -->
<header class="bg-gray-800 shadow-sm sticky top-0 z-30">
  <div class="max-w-6xl mx-auto px-4 py-3 flex items-center justify-between">
    <h1 class="font-bold text-lg">📊 Trading Times</h1>
  </div>
</header>

<main class="max-w-6xl mx-auto px-4 py-6 space-y-8">

  <!-- KUNLIK TIMELINE RULER -->
  <section class="bg-gray-800 rounded-2xl p-4 shadow-sm text-gray-100">
    
    <!-- Sarlavha va Vaqt katakchasi -->
    <div class="flex flex-wrap items-center justify-between gap-2 mb-3">
      <h3 class="font-bold text-base">Likvidlik shkalasi</h3>
      
      <!-- Vaqt katakchasi -->
      <button id="timeBadge" class="text-sm font-mono font-semibold bg-gray-700 text-gray-300 px-3 py-1 rounded-lg border border-gray-600 transition-colors hover:bg-gray-600 focus:outline-none">
        --:-- - --:--
      </button>
    </div>

    <!-- Ruler (Ustunlar) -->
    <div id="rulerWrap" class="ruler-wrap"></div>
    
    <!-- Hozirgi vaqt / Tanlangan vaqt chizig'i -->
    <div class="now-line-container" id="baseContainer">
      <div id="nowLine" class="now-line"></div>
    </div>
  </section>

  <!-- JUFTLIKLAR BO'YICHA -->
  <section class="bg-gray-800 rounded-2xl p-4 shadow-sm">
    <h3 class="font-bold mb-3">Instrument bo'yicha eng yaxshi vaqtlar</h3>
    <div class="flex flex-wrap gap-2 mb-4" id="instrumentFilter"></div>
    <div id="instrumentList" class="space-y-3"></div>
  </section>

</main>

<footer class="text-center text-xs text-gray-500 py-6">
  Ma'lumotlar taxminiy. Trading qarorlaringizni o'zingiz qabul qiling.
</footer>

<script>
// ================== MA'LUMOTLAR ==================
const INSTRUMENTS = [
  { type: 'Forex', pair: 'EURUSD', name: 'EURO / US DOLLAR', utcStart: 1, utcEnd: 5 },
  { type: 'Forex', pair: 'USDCAD', name: 'US DOLLAR / CANADIAN DOLLAR', utcStart: 12, utcEnd: 17 },
  { type: 'Forex', pair: 'USDJPY', name: 'US DOLLAR / JAPANESE YEN', utcStart: 12, utcEnd: 17 },
  { type: 'Forex', pair: 'GBPJPY', name: 'BRITISH POUND / JAPANESE YEN', utcStart: 4, utcEnd: 8 },
  { type: 'Metall', pair: 'XAUUSD', name: 'GOLD', utcStart: 7, utcEnd: 12 },
  { type: 'Indeks', pair: 'US30', name: 'DOW JONES', utcStart: 1, utcEnd: 6, utcStart2: 11.5, utcEnd2: 17 },
  { type: 'Forex', pair: 'AUDUSD', name: 'AUSTRALIAN DOLLAR / US DOLLAR', utcStart: 23, utcEnd: 3, utcStart2: 12, utcEnd2: 16 },
];

// ================== HOLAT ==================
// Foydalanuvchining brauzer vaqtini avtomatik aniqlash (daqiqalarda)
let tzOffset = -new Date().getTimezoneOffset() / 60; 
let selectedHour = null;

// ================== YORDAMCHI ==================
function pad(n){ return String(Math.floor(n)).padStart(2,'0'); }

function formatLocalTime(utcH) {
  let local = (utcH + tzOffset) % 24;
  if (local < 0) local += 24;
  let h = Math.floor(local);
  let m = Math.round((local - h) * 60);
  return `${pad(h)}:${pad(m)}`;
}

function liquidityAt(utcHour){
  const london = utcHour >= 7 && utcHour < 16;
  const ny = utcHour >= 12 && utcHour < 21;
  const tokyo = utcHour >= 0 && utcHour < 9;
  if (london && ny) return 'overlap';
  if (london || ny) return 'high';
  if (tokyo) return 'medium';
  return 'low';
}

// ================== RENDER: RULER ==================
function renderRuler(){
  const wrap = document.getElementById('rulerWrap');

  wrap.innerHTML = '';
  for (let utc = 0; utc < 24; utc++){
    const liq = liquidityAt(utc);
    const seg = document.createElement('div');
    seg.className = `ruler-seg liq-${liq}`;
    seg.id = `seg-${utc}`;
    if (selectedHour !== null && utc === selectedHour) seg.classList.add('active');
    seg.dataset.utc = utc;
    seg.title = `${formatLocalTime(utc)} — ${formatLocalTime(utc+1)}`;
    
    seg.addEventListener('click', () => {
      selectedHour = (selectedHour === utc) ? null : utc;
      renderRuler();
      updateTimeBadge();
      updateNowLine();
    });
    wrap.appendChild(seg);
  }
  
  if (selectedHour !== null) wrap.classList.add('has-active');
  else wrap.classList.remove('has-active');
}

// ================== RENDER: VAQT KATAKCHASI ==================
function updateTimeBadge(){
  const badge = document.getElementById('timeBadge');
  
  if (selectedHour === null) {
    const now = new Date();
    const utcH = now.getUTCHours();
    const localNow = (utcH + tzOffset + 24) % 24;
    const floorHour = Math.floor(localNow);
    const utcEquiv = (floorHour - tzOffset + 24) % 24;
    
    const start = formatLocalTime(utcEquiv);
    const end = formatLocalTime(utcEquiv + 1);
    badge.textContent = `${start} - ${end}`;
    badge.className = 'text-sm font-mono font-semibold bg-gray-700 text-gray-300 px-3 py-1 rounded-lg border border-gray-600 transition-colors hover:bg-gray-600 focus:outline-none cursor-default';
  } else {
    const start = formatLocalTime(selectedHour);
    const end = formatLocalTime(selectedHour + 1);
    badge.textContent = `${start} - ${end}`;
    badge.className = 'text-sm font-mono font-semibold bg-brand-500 text-white px-3 py-1 rounded-lg border border-brand-500 transition-colors hover:bg-brand-600 focus:outline-none cursor-pointer';
  }
}

document.getElementById('timeBadge').addEventListener('click', () => {
  if (selectedHour !== null) {
    selectedHour = null;
    renderRuler();
    updateTimeBadge();
    updateNowLine();
  }
});

// ================== RENDER: HOZIRGI VAQT BELGISI ==================
function updateNowLine(){
  const line = document.getElementById('nowLine');
  const baseContainer = document.getElementById('baseContainer');
  
  // Agar biror davr tanlangan bo'lsa
  if (selectedHour !== null) {
    const activeSeg = document.getElementById(`seg-${selectedHour}`);
    
    if (activeSeg) {
      const segRect = activeSeg.getBoundingClientRect();
      const baseRect = baseContainer.getBoundingClientRect();
      
      // Tanlangan ustunning boshlanish nuqtasi va eni
      const leftOffset = segRect.left - baseRect.left;
      
      // Chiziqni tanlangan ustunga moslashtiramiz
      line.style.left = `${leftOffset}px`;
      line.style.width = `${segRect.width}px`;
      line.style.opacity = 1;
      
      // Agar hozirgi vaqt tanlanmagan bo'lsa, rangini kulrangroq qilish (ixtiyoriy)
      // line.style.backgroundColor = '#3b82f6'; 
    }
  } else {
    // Hech narsa tanlanmagan bo'lsa, hozirgi vaqtni ko'rsatadi
    const now = new Date();
    const utcHours = now.getUTCHours();
    const utcMinutes = now.getUTCMinutes();
    const utcSeconds = now.getUTCSeconds();
    
    const totalHours = utcHours + utcMinutes / 60 + utcSeconds / 3600;
    const percentage = (totalHours / 24) * 100;
    
    // Standart holatda chiziq eni taxminan 1 soatlik bo'ladi
    line.style.left = `${percentage}%`;
    line.style.width = `${100 / 24}%`;
    line.style.opacity = 1;
  }
}

// ================== INSTRUMENTLAR ==================
function renderInstruments(){
  const filterEl = document.getElementById('instrumentFilter');
  const types = ['Hammasi', ...new Set(INSTRUMENTS.map(i => i.type))];
  filterEl.innerHTML = types.map((t, i) =>
    `<button class="inst-btn text-sm px-3 py-1.5 rounded-lg border border-gray-600 text-gray-300 ${i===0?'bg-brand-500 text-white border-brand-500':''}" data-type="${t}">${t}</button>`
  ).join('');

  document.querySelectorAll('.inst-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.inst-btn').forEach(b => {
        b.classList.remove('bg-brand-500','text-white','border-brand-500');
        b.classList.add('border-gray-600','text-gray-300');
      });
      btn.classList.add('bg-brand-500','text-white','border-brand-500');
      btn.classList.remove('border-gray-600','text-gray-300');
      renderInstrumentList(btn.dataset.type);
    });
  });
  renderInstrumentList('Hammasi');
}

function renderInstrumentList(type){
  const list = document.getElementById('instrumentList');
  const items = type === 'Hammasi' ? INSTRUMENTS : INSTRUMENTS.filter(i => i.type === type);
  
  list.innerHTML = items.map(i => {
    let timeStr = `${formatLocalTime(i.utcStart)} – ${formatLocalTime(i.utcEnd)}`;
    if (i.utcStart2 !== undefined) {
      timeStr += `<br><span class="text-xs text-gray-500">va</span> ${formatLocalTime(i.utcStart2)} – ${formatLocalTime(i.utcEnd2)}`;
    }

    return `
      <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3 p-4 rounded-xl bg-gray-700/50 border border-gray-700">
        <div>
          <p class="font-bold text-base text-white">${i.pair}</p>
          <p class="text-xs text-gray-400 uppercase tracking-wide">${i.name}</p>
        </div>
        <div class="text-left sm:text-right">
          <div class="inline-flex items-center gap-2 text-sm font-mono font-bold text-gray-200 bg-gray-800 px-3 py-1.5 rounded-lg border border-gray-600">
            <span class="text-gray-400">⏱</span>
            <span class="text-center">${timeStr}</span>
          </div>
        </div>
      </div>
    `;
  }).join('');
}

// ================== INIT ==================
(function init(){
  // Vaqt mintaqasini avtomatik aniqlash
  tzOffset = -new Date().getTimezoneOffset() / 60;

  renderInstruments();
  renderRuler();
  updateTimeBadge();
  
  // DOM to'liq yuklangandan keyin chiziqni to'g'ri o'lchash uchun ozgina kutish
  setTimeout(updateNowLine, 50);

  // Har sekundda hozirgi vaqtni kuzatish (agar tanlangan bo'lsa, baribir ta'sir qilmaydi)
  setInterval(() => {
    if (selectedHour === null) {
      updateNowLine();
    }
  }, 1000);

  // Har daqiqada vaqt katakchasini yangilash
  setInterval(() => {
    if (selectedHour === null) {
      updateTimeBadge();
    }
  }, 60000);

  // Ekran o'lchami o'zgarganda (masalan, telefon burilsa) chiziqni qayta hisoblash
  window.addEventListener('resize', updateNowLine);
})();
</script>
</body>
</html>
